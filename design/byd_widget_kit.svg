  <!-- REUSABLE COLOR & COMPONENT TOKENS STRIP -->
  <g id="Design_Tokens_Strip" transform="translate(36, 355)">
    <rect x="0" y="0" width="884" height="190" rx="18" fill="#141A18" stroke="#26302B"/>
    <text x="20" y="30" fill="#ECF2EE" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">Reusable Tokens &amp; Components (Colors matching android-companion/app/src/main/res/values-night/colors.xml)</text>

    <g transform="translate(20, 52)">
      <rect width="120" height="54" rx="12" fill="#171E1B" stroke="#28332E"/>
      <text x="12" y="24" fill="#ECF2EE" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">Widget Card</text>
      <text x="12" y="42" fill="#9AA8A1" font-family="Inter, Segoe UI, sans-serif" font-size="10.5">#171E1B</text>
    </g>
    <g transform="translate(154, 52)">
      <rect width="120" height="54" rx="12" fill="#202925" stroke="#2C3833"/>
      <text x="12" y="24" fill="#ECF2EE" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">Battery Subcard</text>
      <text x="12" y="42" fill="#9AA8A1" font-family="Inter, Segoe UI, sans-serif" font-size="10.5">#202925</text>
    </g>
    <g transform="translate(288, 52)">
      <rect width="120" height="54" rx="12" fill="#6BE3AF"/>
      <text x="12" y="24" fill="#05291E" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">SoC Emerald</text>
      <text x="12" y="42" fill="#05291E" font-family="Inter, Segoe UI, sans-serif" font-size="10.5">#6BE3AF</text>
    </g>
    <g transform="translate(422, 52)">
      <rect width="120" height="54" rx="12" fill="#A9DFCE"/>
      <text x="12" y="24" fill="#05291E" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">Lock Tile</text>
      <text x="12" y="42" fill="#05291E" font-family="Inter, Segoe UI, sans-serif" font-size="10.5">#A9DFCE</text>
    </g>
    <g transform="translate(556, 52)">
      <rect width="120" height="54" rx="12" fill="#CDE5FF"/>
      <text x="12" y="24" fill="#06243E" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">Unlock Tile</text>
      <text x="12" y="42" fill="#06243E" font-family="Inter, Segoe UI, sans-serif" font-size="10.5">#CDE5FF</text>
    </g>
    <g transform="translate(690, 52)">
      <rect width="174" height="54" rx="12" fill="#184B3B" stroke="#2F7C61"/>
      <text x="12" y="24" fill="#8CF7C7" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">Active AC / Emerald Pill</text>
      <text x="12" y="42" fill="#8CF7C7" font-family="Inter, Segoe UI, sans-serif" font-size="10.5">#184B3B / #8CF7C7</text>
    </g>

    <text x="20" y="142" fill="#9AA8A1" font-family="Inter, Segoe UI, sans-serif" font-size="12">Tip: Drag this SVG straight into Figma or Penpot — every card, text label, icon, and tile stays editable &amp; can be turned into Figma Components.</text>
    <text x="20" y="164" fill="#9AA8A1" font-family="Inter, Segoe UI, sans-serif" font-size="12">Want Light Mode + 2x2 + 4x1 + 4x3 + Phone Screen frames in one Figma kit? Enable the Figma plugin below or let me expand this SVG/HTML kit.</text>
  </g>
</svg>
