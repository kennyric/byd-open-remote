plugins {
    id 'com.android.application'
}

def agcAppId = "0"
def agcCpId = "0"
def agcFile = file('agconnect-services.json')
if (agcFile.exists()) {
    def agcJson = new groovy.json.JsonSlurper().parse(agcFile)
    if (agcJson?.client?.app_id) agcAppId = agcJson.client.app_id.toString()
    if (agcJson?.client?.cp_id) agcCpId = agcJson.client.cp_id.toString()
}

// ---------------------------------------------------------------------------
// APK signing (MANDATORY)
//
// Every distributed APK must be signed with the project's canonical key, or
// installed users cannot update in place ("App not installed"). The canonical
// certificate is:
//   SHA-256 D1:67:0D:07:3C:1A:85:42:B7:80:80:2A:DF:CC:41:DE:58:87:5B:C5:98:AD:CC:76:44:D8:CC:8F:15:5C:B8:99
//
// Resolution order (first existing file wins):
//   1. BYD_KEYSTORE env var
//   2. byd.keystore in local.properties
//   3. ~/.android/byd-open-remote.jks   (preferred permanent home)
//   4. ~/.android/debug.keystore        (current canonical file)
// Never fall back to the machine's default debug keystore: that is how the
// v1.0.5 -> v1.1.0 signature break happened.
// ---------------------------------------------------------------------------
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def canonicalCertSha256 = 'D1670D073C1A8542B780802ADFCC41DE58875BC598ADCC7644D8CC8F155CB899'
def homeDir = System.getProperty('user.home')
def keystoreCandidates = [
        System.getenv('BYD_KEYSTORE'),
        localProps.getProperty('byd.keystore'),
        homeDir + '/.android/byd-open-remote.jks',
        homeDir + '/.android/debug.keystore'
]
def canonicalKeystorePath = keystoreCandidates.find { it != null && !it.trim().isEmpty() && file(it).exists() }
def canonicalKeystorePassword = System.getenv('BYD_KEYSTORE_PASSWORD')
        ?: localProps.getProperty('byd.keystore.password') ?: 'android'
def canonicalKeyAlias = System.getenv('BYD_KEY_ALIAS')
        ?: localProps.getProperty('byd.key.alias') ?: 'androiddebugkey'
def canonicalKeyPassword = System.getenv('BYD_KEY_PASSWORD')
        ?: localProps.getProperty('byd.key.password') ?: canonicalKeystorePassword

android {
    namespace 'com.bydwatch.companion'
    compileSdk 34

    signingConfigs {
        canonical {
            if (canonicalKeystorePath != null) {
                storeFile file(canonicalKeystorePath)
                storePassword canonicalKeystorePassword
                keyAlias canonicalKeyAlias
                keyPassword canonicalKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.bydopenremote.app'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '1.3.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField "String", "WATCH_PACKAGE_NAME", "\"com.bydwatch.watch\""
        buildConfigField "String", "WATCH_CERT_FINGERPRINT", "\"com.bydwatch.watch_BBG+cmVghVnFoIr3ewR8fzWOe/T1PZKjybLqvtVd6ohc65XSefxD048CQzjWAwDtHJKXGWZeqNc5Qq/Fl8ZWIUI=\""
        buildConfigField "String", "STORE_WATCH_PACKAGE_NAME", "\"com.evwatch.bridge\""
        buildConfigField "String", "STORE_WATCH_CERT_FINGERPRINT", "\"\""

        manifestPlaceholders = [
            HUAWEI_APP_ID: agcAppId,
            HUAWEI_CP_ID: agcCpId
        ]
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.canonical
        }
        release {
            signingConfig signingConfigs.canonical
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Indicator colors for the demo splash badge now live in src/demo/res/values/colors.xml,
    // because aapt does not substitute manifest placeholders inside <color> values.
    def demoManifestPlaceholders = [:]

    flavorDimensions += 'edition'
    productFlavors {
        standard {
            dimension 'edition'
            buildConfigField "boolean", "DEMO_BUILD", "false"
            manifestPlaceholders.putAll([DEMO_BUILD: 'false',
                                         DEMO_SETUP_TILE: 'false',
                                         DEMO_SPLASH_LABEL: '@string/app_name'])
        }
        demo {
            dimension 'edition'
            // Completely separate app: own package, own data, no shared authorities,
            // so it can be installed alongside the release build. The splash label rides on
            // the launcher activity so it can never replace the app_name key that widgets and
            // the Quick Settings tile resolve at runtime.
            applicationId 'com.bydopenremote.demo'
            // Distinct version so an in-place update is unambiguous ("1.1.0-demo2" in Settings).
            versionCode 19
            versionNameSuffix '-demo13'
            buildConfigField "boolean", "DEMO_BUILD", "true"
            manifestPlaceholders.putAll(demoManifestPlaceholders + [
                DEMO_SETUP_TILE   : 'true',
                DEMO_BUILD        : 'true',
                DEMO_SPLASH_LABEL : '@string/demo_launcher_label'
            ])
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = variant.name.toLowerCase().contains("demo")
                    ? "BYD-Open-Remote-Demo.apk"
                    : "BYD-Open-Remote.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    sourceSets {
        test {
            resources.srcDirs += ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.huawei.hms:wearengine:5.0.3.304'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'org.json:json:20240303'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// Refuse to assemble an APK unless the canonical signing key is present and correct.
tasks.register('checkSigningKey') {
    doLast {
        if (canonicalKeystorePath == null) {
            throw new GradleException(
                    "No APK signing keystore found. Put the project key at ~/.android/byd-open-remote.jks " +
                    "or set BYD_KEYSTORE. Expected certificate SHA-256: " + canonicalCertSha256)
        }
        def keytool = new File(System.getProperty('java.home'), 'bin/keytool' + (System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : ''))
        def output = new StringBuilder()
        def proc = [keytool.absolutePath, '-list', '-v', '-keystore', canonicalKeystorePath,
                    '-storepass', canonicalKeystorePassword].execute()
        proc.consumeProcessOutput(output, output)
        proc.waitForOrKill(30000)
        def normalized = output.toString().replaceAll(':', '').toUpperCase()
        if (!normalized.contains(canonicalCertSha256)) {
            throw new GradleException(
                    "Wrong signing key at " + canonicalKeystorePath + ".\n" +
                    "Expected SHA-256 " + canonicalCertSha256 + " but the keystore does not contain it.\n" +
                    "Do NOT ship this APK: users would get \"App not installed\". See docs/RELEASING.md.")
        }
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /^(assemble|bundle).*/) {
        task.dependsOn('checkSigningKey')
    }
}

// ---------------------------------------------------------------------------
// APK export
//
// Every assemble* build also copies its APK to E:\Kenny\Huawei\APK using the
// release asset names, so the newest standard build is always
// APK\BYD-Open-Remote.apk (demo: APK\BYD-Open-Remote-Demo.apk).
// ---------------------------------------------------------------------------
def apkExportDir = file('E:/Kenny/Huawei/APK')

[
        ['StandardDebug', 'standard', 'debug', 'BYD-Open-Remote.apk'],
        ['StandardRelease', 'standard', 'release', 'BYD-Open-Remote.apk'],
        ['DemoDebug', 'demo', 'debug', 'BYD-Open-Remote-Demo.apk'],
        ['DemoRelease', 'demo', 'release', 'BYD-Open-Remote-Demo.apk'],
].each { spec ->
    def variant = spec[0]
    def apkName = spec[3]
    def source = layout.buildDirectory.file("outputs/apk/${spec[1]}/${spec[2]}/${apkName}")
    def exportTask = tasks.register("export${variant}Apk") {
        doLast {
            // A failed assemble leaves the previous APK in place; do not pretend it is new.
            if (tasks.named("assemble${variant}").get().state.failure != null) return
            def apk = source.get().asFile
            if (!apk.exists()) {
                logger.warn("APK export skipped: ${apk} does not exist")
                return
            }
            def target = new File(apkExportDir, apkName)
            target.parentFile.mkdirs()
            java.nio.file.Files.copy(apk.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("APK exported: ${target}")
        }
    }
    tasks.matching { it.name == "assemble${variant}" }.configureEach {
        finalizedBy(exportTask)
    }
}
